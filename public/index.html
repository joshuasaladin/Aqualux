<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aqualux CRM</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💧</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login-screen" class="login-screen hidden">
  <div class="login-card">
    <div class="brand"><span class="brand-drop">💧</span> Aqualux <span class="brand-sub">CRM</span></div>
    <p>Enter your admin password to continue.</p>
    <form id="login-form">
      <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" required>
      <button type="submit" class="btn btn-primary">Sign in</button>
      <div id="login-error" class="login-error"></div>
    </form>
  </div>
</div>

<div id="app" class="hidden">
  <header class="topbar">
    <div class="brand"><span class="brand-drop">💧</span> Aqualux <span class="brand-sub">Concierge CRM</span></div>
    <nav>
      <button class="nav-btn active" data-view="leads">Leads</button>
      <button class="nav-btn" data-view="confirmed">Confirmed</button>
      <button class="nav-btn" data-view="calendar">Calendar</button>
      <button class="nav-btn" data-view="clients">Clients</button>
      <button class="nav-btn" data-view="settings">Settings <span id="gmail-dot" class="dot dot-off" title="Gmail not connected"></span></button>
    </nav>
    <button class="btn btn-primary" id="btn-new-lead">+ New lead</button>
  </header>

  <main>
    <!-- ============================== LEADS ============================== -->
    <section id="view-leads" class="view">
      <div class="stat-grid" id="stat-grid"></div>
      <div class="filters">
        <input type="search" id="lead-search" placeholder="Search name, email, service…">
        <button class="btn" id="btn-sync">⟳ Sync Gmail</button>
      </div>
      <div id="lead-list" class="card-list"></div>
    </section>

    <!-- ============================ CONFIRMED ============================ -->
    <section id="view-confirmed" class="view hidden">
      <h2>Confirmed bookings</h2>
      <div id="confirmed-list" class="card-list"></div>
    </section>

    <!-- ============================ CALENDAR ============================= -->
    <section id="view-calendar" class="view hidden">
      <div class="cal-header">
        <button class="btn" id="cal-prev">‹</button>
        <h2 id="cal-title"></h2>
        <button class="btn" id="cal-next">›</button>
      </div>
      <div class="cal-grid cal-dow">
        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <p class="cal-hint">Shows bookings that are marked <b>Confirmed</b> and have a service date.</p>
    </section>

    <!-- ============================ CLIENTS ============================== -->
    <section id="view-clients" class="view hidden">
      <div class="filters">
        <input type="search" id="client-search" placeholder="Search clients…">
      </div>
      <div id="client-list" class="card-list"></div>
    </section>

    <!-- ============================ SETTINGS ============================= -->
    <section id="view-settings" class="view hidden">
      <h2>Gmail connection</h2>
      <div class="panel" id="gmail-panel"></div>
    </section>
  </main>
</div>

<!-- ========================= LEAD DETAIL DRAWER ========================= -->
<div id="drawer-backdrop" class="drawer-backdrop hidden"></div>
<aside id="drawer" class="drawer hidden">
  <div id="drawer-content"></div>
</aside>

<!-- =========================== NEW LEAD MODAL =========================== -->
<div id="modal-backdrop" class="modal-backdrop hidden">
  <div class="modal">
    <h2>New lead</h2>
    <form id="new-lead-form">
      <div class="form-row">
        <label>Client name *<input name="name" required placeholder="Jane Smith"></label>
        <label>Email *<input name="email" type="email" required placeholder="jane@example.com"></label>
      </div>
      <div class="form-row">
        <label>Phone<input name="phone" placeholder="+297 …"></label>
        <label>Service<input name="service" placeholder="Yacht charter, private chef…"></label>
      </div>
      <div class="form-row">
        <label>Service date<input name="service_date" type="date"></label>
        <label>Price<input name="price" type="number" min="0" step="0.01" placeholder="0.00"></label>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" id="modal-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Create lead</button>
      </div>
    </form>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
